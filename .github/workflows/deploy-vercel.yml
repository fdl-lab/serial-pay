# 本番デプロイは通常 `npx vercel deploy --prod`（または Vercel Dashboard）で行う。
# GitHub Actions 自動デプロイはトークン不整合で失敗しやすいため、手動実行のみ。
name: Deploy to Vercel

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN missing"; exit 1; fi
          if [ -z "$VERCEL_ORG_ID" ]; then echo "VERCEL_ORG_ID missing"; exit 1; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "VERCEL_PROJECT_ID missing"; exit 1; fi
          echo "org=${VERCEL_ORG_ID:0:8}... project=${VERCEL_PROJECT_ID:0:8}..."
          vercel whoami --token="$VERCEL_TOKEN"

      - name: Deploy to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
